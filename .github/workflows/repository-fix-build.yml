name: Repository fix build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to build
        required: true
        default: fix/repo-http-fallback
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patched source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Checkout libxposed API
        uses: actions/checkout@v4
        with:
          repository: libxposed/api
          path: libxposed/api

      - name: Checkout libxposed service
        uses: actions/checkout@v4
        with:
          repository: libxposed/service
          path: libxposed/service

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"; fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build manager APK only
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare manager APK and report
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/ReLSPosed-manager-debug.apk
          sha256sum build-output/ReLSPosed-manager-debug.apk > build-output/SHA256SUMS
          ls -lh build-output

      - name: Upload install packages
        uses: actions/upload-artifact@v4
        with:
          name: ReLSPosed-repo-fix-${{ github.run_number }}
          path: build-output/*
          if-no-files-found: error
          retention-days: 30
